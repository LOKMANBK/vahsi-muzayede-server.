}

function sendReady(){
  if(!ws||ws.readyState!==1){showErr('Bağlantı yok.');return;}
  ws.send(JSON.stringify({type:'READY'}));
}

// ── Countdown ─────────────────────────────────────────────
// Not: geri sayım artık sunucudan gelen MUTLAK bir zaman damgasına
// (nextAutoAt) göre çalışır — hem host hem misafir aynı saniyeyi görür.
// İstemci burada hiçbir action GÖNDERMEZ; faz geçişlerini yalnızca
// sunucu tetikler (bkz. RoomManager #scheduleAuto). onDone sadece
// görsel bir kapanış efekti (varsa) için kullanılır.
function clearAutoTimer(){
  clearTimeout(autoTimer);clearInterval(countdownTick);autoTimer=null;
}
function countdownPct(){
  if(!countdownEnd||!countdownTotal)return 100;
  return Math.max(0,Math.round(((countdownEnd-Date.now())/countdownTotal)*100));
}
function startCountdown(endAt,onDone){
  clearAutoTimer();
  if(!endAt){
    // Sunucudan henüz bir zamanlama gelmediyse (ör. çok erken bir render) —
    // makul bir varsayılanla göster, bir sonraki STATE_UPDATE düzeltecek.
    endAt=Date.now()+3000;
  }
  countdownEnd=endAt;countdownTotal=Math.max(1,endAt-Date.now());
  countdownTick=setInterval(()=>{
    const lbl=document.querySelector('#cd-lbl');
    const fill=document.querySelector('#cd-fill');
    if(lbl){
      const sec=Math.max(0,Math.ceil((countdownEnd-Date.now())/1000));
      if(currentState?.status==='auction'){
        const isMyTurn=currentState.auction?.activeBidderId===myPlayerId;
        lbl.textContent=isMyTurn?`${sec}sn içinde otomatik pas geçilir!`:`Rakip için ${sec}sn kaldı…`;
      }
      else if(currentState?.status==='round_result')lbl.textContent=`${sec}sn içinde devam ediyor…`;
      else if(currentState?.status==='collection')lbl.textContent=readyPlayers.has(myPlayerId)?'Rakip bekleniyor…':`Hazır ol! ${sec}sn`;
      else if(currentState?.status==='battle'){
        // revealed sonrası yazı ve bar yok
        if(!currentState.battle?.revealed)
          lbl.textContent=`${sec}sn içinde savaşıyor…`;
      }
    }
    if(fill)fill.style.width=countdownPct()+'%';
    // Geri sayım sesleri: son 3 saniyede tık sesi
    const secNow=Math.ceil((countdownEnd-Date.now())/1000);
    if(secNow<=3&&secNow>0){
      if(secNow<=1) SFX.tickFinal(); else SFX.tick();
    }
    if(Date.now()>=countdownEnd)clearInterval(countdownTick);
  },250);
  const msLeft=Math.max(0,endAt-Date.now());
  autoTimer=setTimeout(()=>{clearInterval(countdownTick);onDone?.();},msLeft);
}

// ── Kenar rafları ──────────────────────────────────────
// Rafları state'den oluştur — render'da çağrılır, DOM'a doğrudan yazar
function renderSideShelves(){
  // Eskilerini temizle
  document.querySelectorAll('.side-shelf').forEach(el=>el.remove());
  if(!currentState) return;
  const statuses = ['auction','free_choice','round_result','collection','battle'];
  if(!statuses.includes(currentState.status)) return;

  const isBattle = currentState.status === 'battle';
  const b = currentState.battle;

  // Tablet/masaüstünde raflar #app'in hemen yanında, kenar değil
  const appEl = document.getElementById('app');
  const appRect = appEl ? appEl.getBoundingClientRect() : null;

  for(const pid of ['player1','player2']){
    const p = currentState.players[pid];
    if(!p.animals.length) continue;
    const isLeft = pid==='player1';
    const shelf = document.createElement('div');
    shelf.className = 'side-shelf '+(isLeft?'left':'right');

    // Tablet'te (app 480px'den geniş): rafı #app'in hemen yanına konumlandır
    if(appRect && window.innerWidth >= 768){
      if(isLeft){
        shelf.style.left = Math.max(0, appRect.left - 64) + 'px';
      } else {
        shelf.style.right = Math.max(0, window.innerWidth - appRect.right - 64) + 'px';
      }
    }

    p.animals.forEach((a, idx)=>{
      const item = document.createElement('div');

      // Battle modunda: bu hayvan mevcut veya geçmiş karşılaşmada mı?
      let battleClass = '';
      if(isBattle && b){
        const matchForThisAnimal = b.matches.find(m=>m.matchIndex===idx);
        if(matchForThisAnimal){
          battleClass = matchForThisAnimal.winnerId===pid ? 'battle-win' : 'battle-lose';
        } else if(b.matchIndex===idx && b.revealed && b.currentMatch){
          battleClass = b.currentMatch.winnerId===pid ? 'battle-win' : 'battle-lose';
        }
      }

      item.className = 'side-animal'+( battleClass?' '+battleClass:'');
      item.innerHTML = isLeft
        ? `<span class="sa-emoji">${a.emoji}</span><span class="sa-count">×${a.quantity}</span>`
        : `<span class="sa-count">×${a.quantity}</span><span class="sa-emoji">${a.emoji}</span>`;
      shelf.appendChild(item);
    });
    document.body.appendChild(shelf);
  }
}

// ── Hayvan uçuş animasyonu ─────────────────────────────
function flyAnimalToShelf(emoji, quantity, winnerId){
  // Başlangıç: ekranın ortası (hayvanın göründüğü yer)
  const animalEl = document.querySelector('.a-emoji');
  let startX, startY;
  if(animalEl){
    const r = animalEl.getBoundingClientRect();
    startX = r.left + r.width/2;
    startY = r.top  + r.height/2;
  } else {
    startX = window.innerWidth/2;
    startY = window.innerHeight/2;
  }

  // Hedef: o oyuncunun kenar rafı
  const isLeft = winnerId==='player1';
  const endX   = isLeft ? 20 : window.innerWidth - 60;
  const endY   = window.innerHeight/2;

  // Uçan emoji
  const flyer = document.createElement('div');
  flyer.className = 'flying-animal';
  flyer.textContent = emoji;
  flyer.style.cssText = `
    left:${startX}px; top:${startY}px;
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
    transition:left 2s cubic-bezier(.25,.46,.45,.94),
               top 2s cubic-bezier(.25,.46,.45,.94),
               transform 2s ease,
               opacity 2s ease;
  `;
  document.body.appendChild(flyer);

  // round_result ekranındaki emoji konumunu dene (daha doğru başlangıç)
  const roundEmoji = document.querySelector('.a-emoji, .animal-big .a-emoji');
  if(roundEmoji && !animalEl){
    const re = roundEmoji.getBoundingClientRect();
    startX = re.left + re.width/2;
    startY = re.top  + re.height/2;
    flyer.style.left = startX+'px';
    flyer.style.top  = startY+'px';
  }

  // Bir frame sonra hedefe fırlat
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    flyer.style.left = endX+'px';
    flyer.style.top  = endY+'px';
    flyer.style.transform = 'translate(-50%,-50%) scale(0.6)';
    flyer.style.opacity = '0';
  }));

  // 2.1 saniye sonra kaldır
  setTimeout(()=>flyer.remove(), 2200);
}

// ── Konfeti ───────────────────────────────────────────────
function launchConfetti(count=60){
  const colors=['#4f7cff','#4fd671','#e8c14f','#e85f5f','#b07be8','#e8823d'];
  for(let i=0;i<count;i++){
    const piece=document.createElement('div');
    piece.className='confetti-piece';
    piece.style.cssText=`
      left:${Math.random()*100}vw;
      top:-20px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${6+Math.random()*8}px;
      height:${6+Math.random()*8}px;
      border-radius:${Math.random()>0.5?'50%':'2px'};
      animation-duration:${1.5+Math.random()*2}s;
      animation-delay:${Math.random()*0.8}s;
    `;
    document.body.appendChild(piece);
    piece.addEventListener('animationend',()=>piece.remove());
  }
}

  if(!msg)return'Bir hata oluştu.';
  if(msg.includes('already registered'))return'Bu e-posta zaten kayıtlı.';

function relativeTime(iso){
  const diff=(Date.now()-new Date(iso).getTime())/1000;
  if(diff<60)return'Az önce';
  if(diff<3600)return Math.floor(diff/60)+' dk önce';
  if(diff<86400)return Math.floor(diff/3600)+' sa önce';
  return Math.floor(diff/86400)+' gün önce';
}

// ── Başlangıç ─────────────────────────────────────────────
async function loadProfile(){
  if(!authToken){screen='auth';render();return;}
  try{
    // 1. JWT'den authUser'ı al — getProfile buna bağımlı
    const parts=authToken.split('.');
    if(parts.length===3){
      const payload=JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));
      authUser={id:payload.sub,email:payload.email};
    }
    if(!authUser?.id)throw new Error('Token geçersiz');

    // 2. Profili çek — trigger gecikmesi için 3 kez dene
    let tries=0;
    while(!profile && tries<3){
      profile=await sb.getProfile(authToken);
      if(!profile){ tries++; await new Promise(r=>setTimeout(r,800)); }
    }

    // 3. Hâlâ yoksa manuel oluştur (trigger çalışmamış olabilir)
    if(!profile){
      const username=authUser.email.split('@')[0].replace(/[^a-z0-9_]/gi,'').slice(0,20)||'oyuncu';
      await fetch(`${SUPABASE_URL}/rest/v1/profiles`,{
        method:'POST',
        headers:{
          'apikey':SUPABASE_ANON,
          'Authorization':`Bearer ${authToken}`,
          'Content-Type':'application/json',
          'Prefer':'return=minimal',
        },
        body:JSON.stringify({id:authUser.id,username})
      });
      profile=await sb.getProfile(authToken);
    }

    if(!profile)throw new Error('Profil oluşturulamadı');

    friends=await sb.getFriends(authToken);
    const notifs=await sb.getNotifications(authToken);
    unreadCount=notifs.filter(n=>!n.read).length;
    cachedNotifs=notifs;
    seenNotifIds=new Set(notifs.map(n=>n.id));   // mevcut bildirimler için toast basma
    startPresenceHeartbeat();
    screen='menu';render();
  }catch(e){
    console.error('loadProfile hata:',e);
    // Token süresi dolmuşsa sil, yoksa auth ekranına at ama token'ı koru
    if(e.message==='Token geçersiz'){
      authToken=null;localStorage.removeItem('vm_token');
    }
    screen='auth';render();
  }
}

})();

// ── Klavye layout kayması koruması (iOS Safari + Android Chrome) ──
// visualViewport: klavye açılınca küçülen gerçek görünüm alanı.
// Aktif input element görünür alanda kalmazsa scroll ile düzelt.
// Bu olmadan iOS Safari'de teklif input'u klavye altında gizlenebilir.
if(window.visualViewport){
  let _vpKeyboardOpen = false;
  window.visualViewport.addEventListener('resize', ()=>{
    const ratio = window.visualViewport.height / window.innerHeight;
    const keyboardOpen = ratio < 0.75; // %75'ten az → klavye açık
    if(keyboardOpen && !_vpKeyboardOpen){
      _vpKeyboardOpen = true;
      // Aktif element varsa görünür kıl
      const active = document.activeElement;
      if(active && active.tagName === 'INPUT'){
        setTimeout(()=>active.scrollIntoView({behavior:'smooth',block:'center'}), 150);
      }
    } else if(!keyboardOpen){
      _vpKeyboardOpen = false;
    }
  });
}

// Bildirimleri otomatik/anlık düşürmek için periyodik yoklama (5sn)
setInterval(pollNotifications, 5000);

// Aktif düello davetini periyodik kontrol et
setInterval(async()=>{
  if(!authToken||!activeDuelInvite)return;
  try{
    const inv=await sb.getDuelInvite(authToken,activeDuelInvite.id);
    if(!inv)return;
    if(inv.status==='accepted'&&inv.lobby_code){
      // Kabul edildi → lobiye git
      activeDuelInvite=null;
      clearTimeout(duelWaitTimer);
      clearInterval(duelCountdown);
      isPrivateLobby=false;  // lobby_code ile katılıyoruz, private değil
      subScreen='lobby'; lobbyMode='waiting';
      startGame(inv.lobby_code);
    } else if(inv.status==='declined'){
      activeDuelInvite=null;
      clearTimeout(duelWaitTimer);
      clearInterval(duelCountdown);
      showToast(inv.receiver_name||'Rakip'+ ' düello davetini reddetti.',false);
      subScreen=null; render();
    } else if(inv.status==='expired'||inv.status==='cancelled'){
      activeDuelInvite=null;
      if(subScreen==='duel-wait'){subScreen=null;render();}
    }
  }catch{}
},3000);
</script>
</body>
</html>
